<\!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whois Lookup + Terminal</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>Whois Lookup + Web Terminal</h1>
      <p>Use the form below for whois, or run commands such as <code>ssh user@host</code> in the terminal.</p>
    </header>

    <section class="panel">
      <form id="whois-form">
        <label for="domain">Domain</label>
        <input id="domain" name="domain" placeholder="example.com" autocomplete="off" required />
        <button type="submit">Lookup Whois</button>
      </form>
      <pre id="whois-result" class="result">Enter a domain and submit to view whois output.</pre>
    </section>

    <section class="panel terminal-panel">
      <div class="terminal-header">
        <h2>Web Terminal</h2>
        <span>Shell commands run on the server. Use <code>ssh</code> or any installed command.</span>
      </div>
      <div id="terminal"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.7.0/lib/xterm-addon-fit.js"></script>
  <script src="client.js"></script>
</body>
</html>
